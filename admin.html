<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Doce Sabor — Painel</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="admin">

<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">Doce Sabor</a>
    <button type="button" class="nav-cart" id="sair" hidden>
      <span>Sair</span>
    </button>
  </div>
</header>

<main class="admin-main">

  <!-- ============ LOGIN ============ -->
  <section class="admin-login" id="telaLogin">
    <form class="admin-card" id="formLogin" autocomplete="on">
      <p class="eyebrow">Acesso restrito</p>
      <h1 class="admin-titulo">Painel da loja</h1>

      <label class="campo">
        <span>E-mail</span>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </label>

      <label class="campo">
        <span>Senha</span>
        <input type="password" id="senha" name="senha" autocomplete="current-password" required>
      </label>

      <p class="admin-erro" id="erroLogin" role="alert" hidden></p>
      <button type="submit" class="btn btn-brown admin-btn-largo" id="botaoEntrar">Entrar</button>
    </form>
  </section>

  <!-- ============ PAINEL ============ -->
  <section class="admin-painel" id="telaPainel" hidden>

    <div class="admin-cabecalho">
      <div>
        <p class="eyebrow">Seus produtos</p>
        <h1 class="admin-titulo">Bolos de pote</h1>
      </div>
      <button type="button" class="btn btn-brown" id="botaoNovo">Adicionar produto</button>
    </div>

    <p class="admin-aviso" id="avisoPainel" role="status" hidden></p>

    <div class="admin-tabela" id="listaProdutos"></div>
    <p class="admin-vazio" id="listaVazia" hidden>Nenhum produto cadastrado ainda.</p>

  </section>

</main>

<!-- ============ FORMULÁRIO DE PRODUTO (modal) ============ -->
<div class="modal" id="modalProduto" hidden>
  <div class="modal-box modal-box-narrow" role="dialog" aria-modal="true" aria-labelledby="tituloProduto">
    <div class="modal-head">
      <div>
        <p class="eyebrow" id="modoProduto">Novo</p>
        <h2 class="modal-title" id="tituloProduto">Produto</h2>
      </div>
      <button type="button" class="modal-close" id="fecharProduto" aria-label="Fechar">&times;</button>
    </div>

    <form id="formProduto">
      <input type="hidden" id="produtoId">

      <label class="campo">
        <span>Nome do sabor</span>
        <input type="text" id="nome" maxlength="80" required>
      </label>

      <label class="campo">
        <span>Descrição <em>(opcional)</em></span>
        <textarea id="descricao" rows="2" maxlength="300"></textarea>
      </label>

      <div class="campo-linha">
        <label class="campo">
          <span>Preço (R$)</span>
          <input type="number" id="preco" min="0" max="9999" step="0.01" required>
        </label>
        <label class="campo">
          <span>Estoque (un)</span>
          <input type="number" id="estoque" min="0" max="99999" step="1" required>
        </label>
      </div>

      <label class="campo">
        <span>Foto <em>(JPG ou PNG, até 5 MB)</em></span>
        <input type="file" id="imagem" accept="image/jpeg,image/png,image/webp">
      </label>
      <img class="admin-previa" id="previa" alt="" hidden>

      <p class="admin-erro" id="erroProduto" role="alert" hidden></p>

      <div class="modal-foot">
        <button type="button" class="btn btn-outline" id="cancelarProduto">Cancelar</button>
        <button type="submit" class="btn btn-brown" id="salvarProduto">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ CONFIRMAR EXCLUSÃO (modal) ============ -->
<div class="modal" id="modalExcluir" hidden>
  <div class="modal-box modal-box-narrow" role="dialog" aria-modal="true" aria-labelledby="tituloExcluir">
    <div class="modal-head">
      <div>
        <p class="eyebrow">Atenção</p>
        <h2 class="modal-title" id="tituloExcluir">Excluir produto</h2>
      </div>
      <button type="button" class="modal-close" id="fecharExcluir" aria-label="Fechar">&times;</button>
    </div>
    <p class="admin-confirma" id="textoExcluir"></p>
    <div class="modal-foot">
      <button type="button" class="btn btn-outline" id="cancelarExcluir">Manter</button>
      <button type="button" class="btn btn-brown" id="confirmarExcluir">Excluir</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
